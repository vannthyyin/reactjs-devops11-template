name: React App CI/CD

# Run when code is pushed to master or a PR targets master
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Minimum permissions needed to check out the repository
permissions:
  contents: read

# Shared environment variables
env:
  DH_IMAGE: devops11-basic-reactjs

jobs:
  # Job 1: Verify that the React application builds successfully
  build:
    name: Install and Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

  # Job 2: Build and publish Docker image
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    # Run only after the build job succeeds
    needs: build

    # GitHub environment containing Docker Hub secrets
    environment: DH_ENV

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generate an image tag from the Git commit SHA
      - name: Generate Docker Image Tag
        run: echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      # Login to Docker Hub using repository/environment secrets
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.PASSWORD }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.USERNAME }}
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$DH_IMAGE:$TAG" .

      - name: Push Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/$DH_IMAGE:$TAG"

      - name: Always Logout
        if: always()
        run: docker logout
